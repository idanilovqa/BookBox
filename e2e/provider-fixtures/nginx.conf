events {}

http {
    access_log off;
    error_log /dev/stderr warn;

    server {
        listen 8080;
        server_name _;

        location = /openlibrary/search.json {
            default_type application/json;
            alias /fixtures/openlibrary-dune.json;
        }

        location = /googlebooks/volumes {
            default_type application/json;
            alias /fixtures/googlebooks-dune.json;
        }

        location / {
            return 404;
        }
    }
}
