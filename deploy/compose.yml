name: bookbox-prod

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bookbox
      POSTGRES_USER: bookbox
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookbox -d bookbox"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  bookbox-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    init: true
    user: "10001:10001"
    ports:
      - name: http
        target: 8787
        published: "${BOOKBOX_HOST_PORT:-8787}"
        host_ip: "${BOOKBOX_BIND_ADDRESS:?Set BOOKBOX_BIND_ADDRESS to a private LAN address}"
        protocol: tcp
    volumes:
      - type: bind
        source: "${BOOKBOX_LIBRARY_PATH:?Set BOOKBOX_LIBRARY_PATH in deploy/.env}"
        target: /library/audiobooks
        read_only: true
      - type: bind
        source: "${BOOKBOX_CONFIG_HOST_FILE:?Set BOOKBOX_CONFIG_HOST_FILE in deploy/.env}"
        target: /etc/bookbox/config.yml
        read_only: true
    secrets:
      - postgres_password
      - source: app_password_hash
        target: app_password_hash.source
      - source: session_key
        target: session_key.source
    networks:
      - backend
      - outbound
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777
      - /run/bookbox-secrets:rw,nosuid,nodev,noexec,mode=0700,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8787/v1/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M
        reservations:
          cpus: "0.20"
          memory: 192M

  bookbox-catalog-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    restart: unless-stopped
    init: true
    user: "10001:10001"
    volumes:
      # Explicitly approved risk: Docker grants this worker mount-level write
      # access to the whole library. The worker code limits writes to validated
      # cover.jpg/folder.jpg/front.jpg variants, but the mount itself cannot
      # enforce filename-only permissions.
      - type: bind
        source: "${BOOKBOX_LIBRARY_PATH:?Set BOOKBOX_LIBRARY_PATH in deploy/.env}"
        target: /library/audiobooks
      - type: bind
        source: "${BOOKBOX_CONFIG_HOST_FILE:?Set BOOKBOX_CONFIG_HOST_FILE in deploy/.env}"
        target: /etc/bookbox/config.yml
        read_only: true
      - type: volume
        source: cover_cache
        target: /var/lib/bookbox/covers
      - type: volume
        source: cover_backups
        target: /var/lib/bookbox/backups
    secrets:
      - postgres_password
      - source: google_books_key
        target: google_books_key
    environment:
      BOOKBOX_COVER_BACKUP_ROOT: /var/lib/bookbox/backups
      BOOKBOX_GOOGLE_BOOKS_API_KEY_FILE: /run/secrets/google_books_key
    networks:
      - backend
      - outbound
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777
      - /run/bookbox-secrets:rw,nosuid,nodev,noexec,mode=0700,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "for process in /proc/[0-9]*; do [ \"$(readlink \"$$process/exe\")\" = /usr/local/bin/bookbox-catalog-worker ] && exit 0; done; exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 256M

secrets:
  postgres_password:
    file: "${BOOKBOX_POSTGRES_PASSWORD_HOST_FILE:?Set BOOKBOX_POSTGRES_PASSWORD_HOST_FILE in deploy/.env}"
  app_password_hash:
    file: "${BOOKBOX_PASSWORD_HASH_HOST_FILE:?Set BOOKBOX_PASSWORD_HASH_HOST_FILE in deploy/.env}"
  session_key:
    file: "${BOOKBOX_SESSION_KEY_HOST_FILE:?Set BOOKBOX_SESSION_KEY_HOST_FILE in deploy/.env}"
  google_books_key:
    file: "${BOOKBOX_GOOGLE_BOOKS_KEY_HOST_FILE:-./secrets/google_books_key.txt}"

volumes:
  postgres_data:
  cover_cache:
  cover_backups:

networks:
  backend:
    internal: true
  outbound:
